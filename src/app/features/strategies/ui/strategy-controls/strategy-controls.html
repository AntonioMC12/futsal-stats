<section class="sequence-editor" aria-label="Secuencias">
  <div class="timeline">
    @for (phase of phases(); track phase.id; let index = $index) {
      <button
        class="timeline__step"
        type="button"
        [disabled]="status() !== 'idle'"
        [class.is-active]="index === phaseIndex()"
        [attr.aria-current]="index === phaseIndex() ? 'step' : null"
        [attr.aria-label]="'Ir a secuencia ' + phase.order"
        (click)="phaseSelected.emit(index)"
      >
        <strong>{{ phase.order }}</strong
        ><small>{{ phase.durationMs / 1000 }} s</small>
      </button>
    }
    @if (!readonly()) {
      <button
        class="timeline__add"
        type="button"
        aria-label="Añadir secuencia"
        [disabled]="status() !== 'idle'"
        (click)="sequenceAdded.emit()"
      >
        +
      </button>
    }
  </div>
  @if (!readonly()) {
    <div class="sequence-actions">
      <button type="button" [disabled]="status() !== 'idle'" (click)="sequenceDuplicated.emit()">
        Duplicar</button
      ><button
        type="button"
        [disabled]="status() !== 'idle' || phases().length === 1"
        (click)="sequenceDeleted.emit()"
      >
        Eliminar
      </button>
    </div>
  }
</section>
<section class="controls" aria-label="Controles de reproducción">
  <div class="controls__transport">
    <button
      class="control-button control-button--secondary"
      type="button"
      aria-label="Secuencia anterior"
      [disabled]="status() !== 'idle' || phaseIndex() === 0"
      (click)="previousRequested.emit()"
    >
      |◀
    </button>
    <button
      class="control-button control-button--play"
      type="button"
      [disabled]="phases().length < 2"
      [attr.aria-label]="status() === 'playing' ? 'Pausar reproducción' : 'Reproducir estrategia'"
      (click)="playbackToggled.emit()"
    >
      {{
        status() === 'playing' ? 'Ⅱ Pausar' : status() === 'paused' ? '▶ Reanudar' : '▶ Reproducir'
      }}
    </button>
    <button
      class="control-button control-button--secondary"
      type="button"
      aria-label="Detener"
      [disabled]="status() === 'idle'"
      (click)="stopped.emit()"
    >
      ■
    </button>
    <button
      class="control-button control-button--secondary"
      type="button"
      aria-label="Reiniciar"
      (click)="restarted.emit()"
    >
      ↺
    </button>
    <button
      class="control-button control-button--secondary"
      type="button"
      aria-label="Secuencia siguiente"
      [disabled]="status() !== 'idle' || phaseIndex() === phases().length - 1"
      (click)="nextRequested.emit()"
    >
      ▶|
    </button>
  </div>
  <label class="speed-control"
    ><span>Velocidad</span
    ><select [value]="playbackRate()" (change)="speedSelected.emit(numberValue($event))">
      @for (speed of speeds(); track speed.rate) {
        <option [value]="speed.rate">{{ speed.label }}</option>
      }
    </select></label
  >
</section>
