<button
  class="strategy-card"
  type="button"
  [class.is-active]="active()"
  [attr.aria-pressed]="active()"
  (click)="selected.emit(strategy().id)"
>
  <span class="strategy-card__mark" aria-hidden="true">
    <svg viewBox="0 0 32 32">
      <rect x="3" y="5" width="26" height="22" rx="3" />
      <path d="M16 5v22M3 16h26M9 11l4 2-4 2" />
    </svg>
  </span>
  <span class="strategy-card__content">
    <span class="strategy-card__topline">
      <strong>{{ strategy().name }}</strong>
      <span>{{ strategy().phases.length }} fases</span>
    </span>
    <span class="strategy-card__category">{{ strategy().category }}</span>
    <span class="strategy-card__description">{{ strategy().description }}</span>
  </span>
</button>
