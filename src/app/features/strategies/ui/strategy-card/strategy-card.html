<article class="strategy-card">
  <div class="strategy-card__preview" aria-hidden="true">
    <app-tactical-board
      [strategy]="strategy()"
      [phase]="strategy().phases[0]!"
      [pieces]="strategy().phases[0]!.pieces"
      [locked]="true"
      [compact]="true"
    />
  </div>
  <div class="strategy-card__body">
    <div>
      <h2>{{ strategy().name }}</h2>
      <span>{{ strategy().category }}</span>
    </div>
    <p>{{ strategy().phases.length }} secuencias · Actualizada {{ date(strategy().updatedAt) }}</p>
  </div>
  <footer>
    <button class="play-action" type="button" (click)="played.emit(strategy().id)">
      ▶ Reproducir</button
    ><button type="button" (click)="edited.emit(strategy().id)">Editar</button>
  </footer>
</article>
