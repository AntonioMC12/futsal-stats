<div class="strategy-list" aria-label="Catálogo de estrategias">
  @for (strategy of strategies(); track strategy.id) {
    <app-strategy-card
      [strategy]="strategy"
      [canEdit]="canEdit()"
      (played)="strategyPlayed.emit($event)"
      (edited)="strategyEdited.emit($event)"
    />
  }
</div>
