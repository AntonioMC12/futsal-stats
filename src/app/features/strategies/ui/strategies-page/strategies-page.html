<section class="strategies-shell">
  <header class="module-bar">
    <nav aria-label="Secciones de estrategias">
      <a routerLink="designer" routerLinkActive="is-active" (click)="guardNavigation($event)"
        >Diseñador</a
      >
      <a routerLink="library" routerLinkActive="is-active" (click)="guardNavigation($event)"
        >Biblioteca</a
      >
    </nav>
    <label class="team-switcher"
      ><span>Equipo</span
      ><select [value]="context.teamId()" (change)="changeTeam($event)">
        @for (team of context.teams(); track team.id) {
          <option [value]="team.id">{{ team.name }}</option>
        }
      </select></label
    >
  </header>
  <main class="strategies-view"><router-outlet /></main>
</section>
