<div
  class="shell"
  [class.shell--live-match]="liveMatchActive"
  [class.shell--strategies]="strategiesActive"
>
  <app-system-notification />
  <header class="shell__header">
    <a class="shell__brand" routerLink="/dashboard" aria-label="Futsal Stats, dashboard">
      <span class="brand-mark" aria-hidden="true">FS</span>
      <span class="brand-copy"><strong>Futsal Stats</strong><small>Mesa técnica</small></span>
    </a>
    @if (workspace?.activeTeam(); as activeTeam) {
      <label class="workspace-switcher">
        <span>Equipo activo</span>
        <select [value]="activeTeam.id" (change)="changeWorkspace($event)">
          @for (team of workspace.teams(); track team.id) {
            <option [value]="team.id">{{ team.name }}</option>
          }
        </select>
      </label>
    }
    <span class="offline-status" role="status" [hidden]="connectivity.online()">
      Sin conexión · guardado local
    </span>
    <nav class="shell__nav" aria-label="Principal">
      <a routerLink="/dashboard" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 13h7V4H4v9Zm0 7h7v-4H4v4Zm10 0h6v-9h-6v9Zm0-12h6V4h-6v4Z" />
        </svg>
        <span>Inicio</span>
      </a>
      <a routerLink="/players" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm8-1a2.5 2.5 0 1 0 0-5M3 19v-1.5A3.5 3.5 0 0 1 6.5 14h3A3.5 3.5 0 0 1 13 17.5V19m1-5h2.5a3.5 3.5 0 0 1 3.5 3.5V19"
          />
        </svg>
        <span>Plantilla</span>
      </a>
      <a routerLink="/matches" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 4v16M19 4v16M5 7h14M5 17h14M9 7v10M15 7v10" />
        </svg>
        <span>Partidos</span>
      </a>
      <a routerLink="/strategies" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <path d="M12 4v16M3 12h18M7 8l3 2-3 2" />
        </svg>
        <span>Estrategias</span>
      </a>
      <a routerLink="/settings" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19 13.5v-3l-2-.7a7 7 0 0 0-.8-1.8l.9-1.9L15 4l-1.9.9a7 7 0 0 0-2.2 0L9 4 6.9 6.1 7.8 8A7 7 0 0 0 7 9.8l-2 .7v3l2 .7a7 7 0 0 0 .8 1.8l-.9 1.9L9 20l1.9-.9a7 7 0 0 0 2.2 0l1.9.9 2.1-2.1-.9-1.9a7 7 0 0 0 .8-1.8l2-.7Z"
          />
        </svg>
        <span>Ajustes</span>
      </a>
    </nav>
  </header>
  <main class="shell__main">
    <router-outlet></router-outlet>
  </main>
</div>
